version: 2

project_name: mayfly

builds:
  - id: mayfly
    main: ./cmd/mayfly
    binary: mayfly
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/hayfever/mayfly/internal/version.Version={{ .Version }}
      - -X github.com/hayfever/mayfly/internal/version.Commit={{ .Commit }}
      - -X github.com/hayfever/mayfly/internal/version.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# Sign checksums.txt with keyless cosign. The bundle carries the signature and
# the short-lived certificate, so a verifier trusts only the workflow identity
# and the GitHub OIDC issuer. release.yml installs cosign on the goreleaser
# job, which also needs id-token: write.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    output: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  # The GitHub release stays a draft until release.yml's publish job proves
  # that the images, chart, and signatures exist. `prerelease: auto` marks an
  # RC by its version. `make_latest` is a template because `auto` is not a
  # value GoReleaser accepts: an RC sets false and a final release sets true,
  # so the `latest` marker never moves to a release candidate.
  draft: true
  prerelease: auto
  make_latest: '{{ if .Prerelease }}false{{ else }}true{{ end }}'
