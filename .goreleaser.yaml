version: 2

project_name: mayfly

builds:
  - id: mayfly
    main: ./cmd/mayfly
    binary: mayfly
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/hayfever/mayfly/internal/version.Version={{ .Version }}
      - -X github.com/hayfever/mayfly/internal/version.Commit={{ .Commit }}
      - -X github.com/hayfever/mayfly/internal/version.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  draft: false
  prerelease: auto
