# Optional LiteLLM deployment. Create the litellm-secrets Secret before apply.
# For Bedrock on EKS, bind an IRSA service account instead of static AWS keys.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: mayfly
data:
  config.yaml: |
    model_list:
      - model_name: mayfly-default
        litellm_params:
          model: openai/gpt-4.1-mini
          api_key: os.environ/OPENAI_API_KEY
      - model_name: claude-sonnet
        litellm_params:
          model: anthropic/claude-sonnet-4-5
          api_key: os.environ/ANTHROPIC_API_KEY
      - model_name: bedrock-claude
        litellm_params:
          model: bedrock/anthropic.claude-sonnet-4-5-20250929-v1:0
          aws_region_name: us-east-1
      - model_name: openrouter-qwen
        litellm_params:
          model: openrouter/qwen/qwen3-coder
          api_base: https://openrouter.ai/api/v1
          api_key: os.environ/OPENROUTER_API_KEY
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm
  namespace: mayfly
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: mayfly
  labels:
    app.kubernetes.io/name: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
    spec:
      serviceAccountName: litellm
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.110.0
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          envFrom:
            - secretRef:
                name: litellm-secrets
          env:
            - name: HOME
              value: /tmp
          ports:
            - containerPort: 4000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: litellm-config
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: mayfly
spec:
  selector:
    app.kubernetes.io/name: litellm
  ports:
    - name: http
      port: 4000
      targetPort: 4000
