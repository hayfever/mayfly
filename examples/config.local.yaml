server:
  addr: ":8080"
  public_url: "http://localhost:8080"
  internal_url: "http://localhost:8080"
  token_env: MAYFLY_API_TOKEN
  attach_ticket_ttl: 60s
  max_body_bytes: 4194304

sessions:
  namespace: mayfly
  default_ttl: 30m
  max_ttl: 2h
  idle_timeout: 15m
  close_grace: 45s
  event_buffer: 5000
  max_steps: 24
  max_history_messages: 120
  allow_shell: true
  shell_timeout: 120s

queue:
  backend: memory        # bbolt or redis survive a restart
  poll_interval: 500ms

runtime:
  backend: local
  agent_binary: ./bin/mayfly-agent
  state_dir: ./.mayfly
  network_policy: false
  poll_interval: 2s

llm:
  base_url: http://localhost:9099/v1
  model: stub
  allow_models: [stub]
  timeout: 60s

artifacts:
  store: local
  local:
    dir: ./.mayfly/artifacts
  max_bytes: 67108864

skills:
  dirs: [./examples/skills]

agents:
  dirs: [./examples/agents]

mcp:
  servers:
    - name: echo
      transport: http
      url: http://localhost:9100/mcp

triggers:
  - name: generic
    type: generic
    allow_unsigned: true
  - name: github
    type: github
    allow_unsigned: true
  - name: datadog
    type: datadog
    allow_unsigned: true
  - name: slack
    type: slack
    allow_unsigned: true
