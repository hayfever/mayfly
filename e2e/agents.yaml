schemaVersion: 1
name: mayfly/e2e
version: 0.1.0
agents:
  - name: e2e
    description: Deterministic agent for the end-to-end suite (backed by llmstub).
    systemPrompt: |
      You are the Mayfly e2e agent. Write report.md, call the echo tool, then reply.
    skills:
      - incident-triage
    mcpServers:
      - echo
    maxSteps: 8
  - name: denied
    description: Its pods are rejected by an admission policy, so its webhook jobs dead-letter.
    systemPrompt: This agent never runs.
    runtime:
      image: mayfly-e2e.invalid/denied:never
  - name: broken
    description: Its image cannot be pulled, so its sessions fail at start.
    systemPrompt: This agent never runs.
    runtime:
      image: mayfly-e2e.invalid/missing:never
  - name: plugins-inline
    description: Runs the inline plugin fixture (e2e/plugins/inline.plugin.yaml).
    systemPrompt: Call the plugin tool named in the task.
    plugins: [inline]
    maxSteps: 8
  - name: plugins-sidecar
    description: Runs the sidecar plugin fixture (e2e/plugins/sidecar.plugin.yaml).
    systemPrompt: Call the plugin tools named in the task.
    plugins: [sidecar]
    maxSteps: 8
  - name: plugins-service
    description: Runs the service plugin fixture (e2e/plugins/counter.plugin.yaml).
    systemPrompt: Call the plugin tool named in the task.
    plugins: [counter]
    maxSteps: 8
  - name: plugins-missing
    description: Runs the plugin image without /mayfly-plugin, so the session fails.
    systemPrompt: This session never starts.
    plugins: [missing]
    maxSteps: 8
  - name: budget-requests
    description: Request budget the budget tests spend through the internal proxy.
    systemPrompt: Budget test agent.
    maxSteps: 8
    maxLLMRequests: 6
  - name: budget-overlap
    description: Request budget with room for two overlapping proxy calls.
    systemPrompt: Budget test agent.
    maxSteps: 8
    maxLLMRequests: 20
  - name: budget-tokens
    description: Token budget the budget tests report and keep across a restart.
    systemPrompt: Budget test agent.
    maxSteps: 8
    maxLLMTokens: 100000
  - name: budget-large
    description: Large per-agent budget, used to check the override.
    systemPrompt: Budget test agent.
    maxSteps: 8
    maxLLMTokens: 200000
    maxLLMRequests: 20
  - name: budget-small
    description: Small per-agent budget, used to check the override.
    systemPrompt: Budget test agent.
    maxSteps: 8
    maxLLMTokens: 50000
    maxLLMRequests: 4
