# kind cluster for the e2e suite. The default CNI is replaced with Calico,
# which enforces NetworkPolicy; kind's built-in CNI is not relied on.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mayfly-e2e
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
