# Deterministic LLM and MCP servers, so the suite needs no API keys.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmstub
  labels:
    app.kubernetes.io/name: llmstub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llmstub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llmstub
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llmstub
          image: LLMSTUB_IMAGE
          imagePullPolicy: IfNotPresent
          args: ["--addr", ":9099"]
          ports:
            - containerPort: 9099
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9099
            periodSeconds: 2
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: llmstub
spec:
  selector:
    app.kubernetes.io/name: llmstub
  ports:
    - name: http
      port: 9099
      targetPort: 9099
---
