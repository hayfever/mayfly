{{- $secretName := "" -}}
{{- if .Values.secret.create -}}
{{- $secretName = include "mayfly.secretName" . -}}
{{- else -}}
{{- $secretName = required "existingSecret is required unless secret.create is true" .Values.existingSecret -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mayfly.fullname" . }}
  labels:
    {{- include "mayfly.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mayfly.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        {{- include "mayfly.labels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/skills: {{ include (print $.Template.BasePath "/skills-configmap.yaml") . | sha256sum }}
        checksum/agents: {{ include (print $.Template.BasePath "/agents-configmap.yaml") . | sha256sum }}
        {{- with .Values.controlPlane.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "mayfly.controlPlaneServiceAccountName" . }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: mayflyd
          image: {{ include "mayfly.controlPlaneImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/mayfly-config/config.yaml"]
          envFrom:
            - secretRef:
                name: {{ $secretName }}
          env:
            - name: MAYFLY_LOG_LEVEL
              value: {{ default "info" .Values.logLevel | quote }}
            {{- with .Values.controlPlane.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          securityContext:
            {{- toYaml .Values.controlPlane.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/mayfly-config
              readOnly: true
            - name: skills
              mountPath: /etc/mayfly-skills
              readOnly: true
            - name: agents
              mountPath: /etc/mayfly-agents
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: state
              mountPath: /var/lib/mayfly
      volumes:
        - name: config
          configMap:
            name: {{ include "mayfly.configMapName" . }}
        - name: skills
          configMap:
            name: {{ include "mayfly.skillsConfigMapName" . }}
        - name: agents
          configMap:
            name: {{ include "mayfly.agentsConfigMapName" . }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: state
          emptyDir:
            sizeLimit: 2Gi
      {{- with .Values.controlPlane.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
