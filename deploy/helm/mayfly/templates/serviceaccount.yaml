{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mayfly.controlPlaneServiceAccountName" . }}
  labels:
    {{- include "mayfly.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mayfly.agentServiceAccountName" . }}
  labels:
    {{- include "mayfly.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.agentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
