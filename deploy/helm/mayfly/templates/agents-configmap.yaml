apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mayfly.agentsConfigMapName" . }}
  labels:
    {{- include "mayfly.labels" . | nindent 4 }}
{{- if .Values.agents.files }}
data:
  {{- range $name, $content := .Values.agents.files }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
