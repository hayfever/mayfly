{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
{{- if and (not .Values.metrics.address) (ne .Values.metrics.requireAuth false) (not .Values.metrics.serviceMonitor.bearerTokenSecret.name) }}
{{- fail "metrics.serviceMonitor needs a bearer token with the admin scope: set metrics.serviceMonitor.bearerTokenSecret, or set metrics.address with metrics.requireAuth: false" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "mayfly.fullname" . }}
  labels:
    {{- include "mayfly.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.metrics.serviceMonitor.namespace }}
  namespace: {{ . }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "mayfly.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-plane
  {{- with .Values.metrics.serviceMonitor.namespace }}
  namespaceSelector:
    matchNames:
      - {{ . }}
  {{- end }}
  endpoints:
    - port: {{ if .Values.metrics.address }}metrics{{ else }}http{{ end }}
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      {{- with .Values.metrics.serviceMonitor.bearerTokenSecret }}
      {{- if .name }}
      authorization:
        type: Bearer
        credentials:
          name: {{ .name }}
          key: {{ .key | default "token" }}
      {{- end }}
      {{- end }}
{{- end }}
