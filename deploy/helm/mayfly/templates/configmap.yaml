{{- $config := deepCopy .Values.config -}}
{{- $fullname := include "mayfly.fullname" . -}}
{{- $litellmName := include "mayfly.litellmName" . -}}
{{- if ge (int .Values.shutdown.budgetSeconds) (int .Values.shutdown.gracePeriodSeconds) -}}
{{- fail "shutdown.budgetSeconds must be less than shutdown.gracePeriodSeconds" -}}
{{- end -}}
{{- $_ := set $config.server "addr" (printf ":%v" .Values.service.port) -}}
{{- $_ := set $config.server "shutdown_budget" (printf "%ds" (int .Values.shutdown.budgetSeconds)) -}}
{{- $_ := set $config.server "internal_url" (default (printf "http://%s.%s.svc.cluster.local:%v" $fullname .Release.Namespace .Values.service.port) $config.server.internal_url) -}}
{{- $_ := set $config.sessions "namespace" (default .Release.Namespace $config.sessions.namespace) -}}
{{- $_ := set $config.runtime "image" (include "mayfly.agentImage" .) -}}
{{- $_ := set $config.runtime "image_pull_policy" .Values.agentImage.pullPolicy -}}
{{- $pullSecretNames := list -}}
{{- range .Values.imagePullSecrets -}}{{- $pullSecretNames = append $pullSecretNames .name -}}{{- end -}}
{{- $_ := set $config.runtime "image_pull_secrets" $pullSecretNames -}}
{{- $_ := set $config.runtime "service_account" (include "mayfly.agentServiceAccountName" .) -}}
{{- $_ := set $config.runtime "platform_namespace" .Release.Namespace -}}
{{- $_ := set $config.runtime "platform_labels" (dict "app.kubernetes.io/name" (include "mayfly.name" .) "app.kubernetes.io/component" "control-plane") -}}
{{- if not $config.llm.base_url -}}
{{- if .Values.litellm.enabled -}}
{{- $_ := set $config.llm "base_url" (printf "http://%s:%v/v1" $litellmName .Values.litellm.port) -}}
{{- else -}}
{{- $_ := set $config.llm "base_url" "https://api.openai.com/v1" -}}
{{- end -}}
{{- end -}}
{{- if .Values.litellm.enabled -}}
{{- $_ := set $config.llm "api_key_env" .Values.litellm.masterKeyEnv -}}
{{- end -}}
{{- if .Values.metrics.address -}}
{{- if not (hasSuffix (printf ":%v" (int .Values.metrics.port)) .Values.metrics.address) -}}
{{- fail "metrics.address must end with metrics.port" -}}
{{- end -}}
{{- end -}}
{{- $metrics := dict "enabled" .Values.metrics.enabled -}}
{{- if .Values.metrics.address -}}
{{- $_ := set $metrics "address" .Values.metrics.address -}}
{{- end -}}
{{- if not (kindIs "invalid" .Values.metrics.requireAuth) -}}
{{- $_ := set $metrics "require_auth" .Values.metrics.requireAuth -}}
{{- end -}}
{{- $_ := set $config.server "metrics" $metrics -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mayfly.configMapName" . }}
  labels:
    {{- include "mayfly.labels" . | nindent 4 }}
data:
  config.yaml: |
{{ $config | toYaml | indent 4 }}
