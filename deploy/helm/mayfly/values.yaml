nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/hayfever/mayflyd
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

agentImage:
  repository: ghcr.io/hayfever/mayfly-agent
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
replicaCount: 1
logLevel: info

serviceAccount:
  create: true
  controlPlaneName: ""
  agentName: ""
  annotations: {}
  agentAnnotations: {}

rbac:
  create: true

service:
  type: ClusterIP
  port: 8080
  nodePort: null
  annotations: {}

# Prometheus metrics. The endpoint is enabled on the main HTTP port by default
# and needs the admin token there. Set metrics.address to serve it on a
# listener of its own instead, which has no auth unless metrics.requireAuth.
metrics:
  enabled: true
  # Example: ":9090". Must end in ":<metrics.port>".
  address: ""
  port: 9090
  # Empty means required on the main port and not required on a separate
  # address.
  requireAuth: null
  # prometheus.io/scrape annotations on the control-plane pod.
  prometheusAnnotations: false
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels for the ServiceMonitor, such as the selector your
    # Prometheus instance uses.
    labels: {}
    namespace: ""
    # Bearer token Secret for a scrape of an authenticated endpoint.
    bearerTokenSecret:
      name: ""
      key: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mayfly.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Either set existingSecret or enable secret.create and provide literals.
existingSecret: ""
secret:
  create: false
  name: ""
  literals: {}

# Mayfly configuration. The chart fills runtime.image, service accounts,
# platform labels, internal URL, and LiteLLM defaults when empty.
config:
  server:
    public_url: "http://localhost:8080"
    token_env: MAYFLY_API_TOKEN
    attach_ticket_ttl: 60s
    max_body_bytes: 4194304
  sessions:
    namespace: "" # defaults to the release namespace
    default_ttl: 30m
    max_ttl: 2h
    idle_timeout: 15m
    close_grace: 90s
    event_buffer: 5000
    max_steps: 24
    max_history_messages: 120
    max_concurrent: 50
    retention: 30m
    connect_timeout: 2m
    max_restarts: 2
    persistent_workspace: true
    allow_shell: false
    shell_timeout: 120s
    # Session records and the artifact index. bbolt keeps them on the state
    # volume, so GET /api/v1/sessions lists finished sessions and artifact
    # downloads work after a restart. memory keeps them in the process.
    records:
      backend: bbolt
      path: /var/lib/mayfly/sessions.db
  runtime:
    backend: kubernetes
    network_policy: true
    dns_namespace: kube-system
    workspace_limit: 1Gi
    artifact_volume_limit: 1Gi
    plugin_volume_limit: 512Mi
    storage_class: ""
    poll_interval: 2s
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  llm:
    base_url: ""
    api_key_env: OPENAI_API_KEY
    model: gpt-4.1-mini
    allow_models: [gpt-4.1-mini]
    timeout: 180s
  artifacts:
    store: local
    local:
      dir: /var/lib/mayfly/artifacts
    max_bytes: 268435456
  sources:
    state_path: /var/lib/mayfly/schedule.db
    max_artifact_bytes: 16777216
    concurrency: 4
    timeout: 15m
    job_timeout: 30m
  skills:
    dirs: [/etc/mayfly-skills]
  agents:
    dirs: [/etc/mayfly-agents, /etc/mayfly-bundles]
    allowed_images: []
  queue:
    backend: bbolt
    bbolt:
      path: /var/lib/mayfly/queue.db
    max_jobs: 1000
    max_attempts: 5
    retry_base: 5s
    visibility_timeout: 5m
    dedupe_ttl: 72h
    poll_interval: 2s
    redis:
      url: ""
      username: ""
      password_env: ""
      key_prefix: mayfly
      cluster: false
  journal:
    backend: bbolt
    bbolt:
      path: /var/lib/mayfly/journal.db
  plugins:
    namespace: "" # defaults to config.sessions.namespace
    reconcile_interval: 60s
    prune: true
    audit_path: ""
    max_inflight_calls: 256
  mcp:
    servers: []
  triggers: []

skills:
  files: {}

agents:
  files: {}
  # Optional ConfigMap of extra bundle files mounted at /etc/mayfly-bundles.
  # The chart never creates or owns it, so upgrades leave it alone. Empty
  # means "<release fullname>-bundles".
  bundlesConfigMap: ""

litellm:
  enabled: false
  image:
    repository: ghcr.io/berriai/litellm
    tag: main-stable
    digest: ""
  existingSecret: litellm-secrets
  masterKeyEnv: LITELLM_MASTER_KEY
  port: 4000
  serviceAccount:
    annotations: {}
  models:
    - model_name: gpt-4.1-mini
      litellm_params:
        model: openai/gpt-4.1-mini
        api_key: os.environ/OPENAI_API_KEY
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# The control plane stops within shutdown.budgetSeconds of SIGTERM. The pod
# gets shutdown.gracePeriodSeconds before SIGKILL, so the budget must be
# smaller. The budget covers the HTTP drain, the queue worker drain, and the
# session manager shutdown, in that order.
shutdown:
  budgetSeconds: 25
  gracePeriodSeconds: 30

# The queue database, session records, the local artifact store, and the turn
# journal live under /var/lib/mayfly. Persistence is on by default: without it
# a control-plane restart loses accepted webhook work, the session list, and
# every in-flight turn's journal, so the runtime cannot resume.
persistence:
  enabled: true
  size: 2Gi
  storageClass: ""
  accessMode: ReadWriteOnce

controlPlane:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  extraEnv: []
  # Optional Secret whose keys become control-plane environment variables.
  # Source connections read provider credentials from here.
  sourcesSecret: ""
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    privileged: false
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
