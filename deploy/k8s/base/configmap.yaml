apiVersion: v1
kind: ConfigMap
metadata:
  name: mayfly-config
  namespace: mayfly
data:
  config.yaml: |
    version: 1
    server:
      addr: ":8080"
      public_url: "http://localhost:8080"
      internal_url: "http://mayfly.mayfly.svc.cluster.local:8080"
      token_env: MAYFLY_API_TOKEN
      trust_forwarded_for: false
      attach_ticket_ttl: 60s
    sessions:
      namespace: mayfly
      default_ttl: 30m
      max_ttl: 2h
      idle_timeout: 15m
      close_grace: 90s
      event_buffer: 5000
      event_buffer_bytes: 8388608
      max_event_bytes: 65536
      inbox_buffer_bytes: 8388608
      max_concurrent: 50
      max_restarts: 2
      persistent_workspace: true
      retention: 30m
      allow_shell: false
      shell_timeout: 120s
    runtime:
      backend: kubernetes
      image: ghcr.io/hayfever/mayfly-agent:0.1.0
      image_pull_policy: IfNotPresent
      service_account: mayfly-agent
      platform_namespace: mayfly
      platform_labels:
        app.kubernetes.io/name: mayflyd
      network_policy: true
      dns_namespace: kube-system
      workspace_limit: 1Gi
      artifact_volume_limit: 1Gi
      storage_class: ""
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "2"
          memory: 2Gi
    llm:
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      model: gpt-4.1-mini
      timeout: 180s
    artifacts:
      store: local
      local:
        dir: /var/lib/mayfly/artifacts
      max_bytes: 134217728
    queue:
      backend: bbolt
      bbolt:
        path: /var/lib/mayfly/queue.db
      max_jobs: 1000
      max_attempts: 5
      dedupe_ttl: 72h
    journal:
      backend: bbolt
      bbolt:
        path: /var/lib/mayfly/journal.db
    agents:
      dirs: [/etc/mayfly-agents, /etc/mayfly-bundles]
    sources:
      state_path: /var/lib/mayfly/schedule.db
      max_artifact_bytes: 16777216
      concurrency: 4
      timeout: 15m
      job_timeout: 30m
    skills:
      dirs: [/etc/mayfly-skills]
    mcp:
      servers: []
    triggers:
      - name: generic
        type: generic
        secret_env: MAYFLY_WEBHOOK_SECRET
