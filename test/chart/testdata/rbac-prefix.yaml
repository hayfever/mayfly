{{- if .Values.rbac.create -}}
{{- $sessionsNamespace := .Values.config.sessions.namespace | default .Release.Namespace -}}
{{- $pluginsNamespace := dig "plugins" "namespace" "" .Values.config | default $sessionsNamespace -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mayfly.fullname" . }}
  labels:
    {{- include "mayfly.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "update", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "update", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mayfly.fullname" . }}
  labels:
    {{- include "mayfly.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mayfly.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mayfly.controlPlaneServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if ne $pluginsNamespace .Release.Namespace }}
---
# Service plugin objects live in plugins.namespace. When that is another
# namespace, the control plane needs the same Role there.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mayfly.fullname" . }}
  namespace: {{ $pluginsNamespace }}
  labels:
    {{- include "mayfly.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "update", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "update", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mayfly.fullname" . }}
  namespace: {{ $pluginsNamespace }}
  labels:
    {{- include "mayfly.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mayfly.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mayfly.controlPlaneServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
