name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds, scans, then signs each image. Keyless signing uses the workflow's
  # GitHub OIDC identity, so a signature proves which workflow and tag built
  # the image. The scan runs before the signature, so an image with a fixable
  # HIGH or CRITICAL vulnerability is never signed.
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        include:
          - target: mayflyd
            image: mayflyd
          - target: mayfly-agent
            image: mayfly-agent
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: build-date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.build-date.outputs.date }}
          sbom: true
          provenance: mode=max
      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.2
      - name: scan
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          image="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/${{ matrix.image }}@${DIGEST}"
          trivy image --quiet --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 "$image"
      - uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: v3.1.4
      - name: sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          image="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/${{ matrix.image }}@${DIGEST}"
          cosign sign --yes "$image"

  chart:
    runs-on: ubuntu-latest
    needs: [goreleaser, images]
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.1
      - name: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/mayfly --version "$version" --app-version "$version" -d dist
      - name: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/mayfly-*.tgz "oci://ghcr.io/${owner}/charts"
          gh release upload "$GITHUB_REF_NAME" dist/mayfly-*.tgz --clobber
      - uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: v3.1.4
      - name: sign
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          version="${GITHUB_REF_NAME#v}"
          cosign sign --yes "ghcr.io/${owner}/charts/mayfly:${version}"
