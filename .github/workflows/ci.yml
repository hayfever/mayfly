name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: gofmt
        run: |
          out="$(gofmt -l cmd internal test e2e)"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: vet
        run: |
          go vet ./...
          go vet -tags e2e ./e2e
      - name: test
        run: go test ./...
      - name: test-race
        run: go test -race ./internal/... ./cmd/...
      - name: build
        run: go build ./cmd/...
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.1
      - name: chart
        run: |
          helm lint deploy/helm/mayfly --set existingSecret=mayfly-secrets
          helm template mayfly deploy/helm/mayfly -n mayfly \
            --set existingSecret=mayfly-secrets >/dev/null

  api-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: api diff
        run: hack/api-diff.sh

