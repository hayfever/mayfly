name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: gofmt
        run: |
          out="$(gofmt -l cmd internal test)"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: go build ./cmd/...
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1
      - name: chart
        run: |
          helm lint deploy/helm/mayfly --set existingSecret=mayfly-secrets
          helm template mayfly deploy/helm/mayfly -n mayfly \
            --set existingSecret=mayfly-secrets >/dev/null

  kind-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: install kind
        run: |
          curl -fsSL https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 -o /tmp/kind
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
      - name: install kubectl
        run: |
          curl -fsSL https://dl.k8s.io/release/stable.txt -o /tmp/kube-version
          curl -fsSL "https://dl.k8s.io/release/$(cat /tmp/kube-version)/bin/linux/amd64/kubectl" -o /tmp/kubectl
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
      - name: build and deploy
        run: |
          make build
          ./hack/kind-up.sh
      - name: e2e
        run: ./hack/e2e-kind.sh
