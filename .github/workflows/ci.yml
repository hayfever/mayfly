name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: gofmt
        run: |
          out="$(gofmt -l cmd internal test e2e)"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: vet
        run: |
          go vet ./...
          go vet -tags e2e ./e2e
      - name: test
        run: go test ./...
      - name: build
        run: go build ./cmd/...
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1
      - name: chart
        run: |
          helm lint deploy/helm/mayfly --set existingSecret=mayfly-secrets
          helm template mayfly deploy/helm/mayfly -n mayfly \
            --set existingSecret=mayfly-secrets >/dev/null

