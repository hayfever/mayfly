name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    name: kind (${{ matrix.queue }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        queue: [bbolt, redis]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1
      - name: install kind
        run: |
          curl -fsSL https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 -o /tmp/kind
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
      - name: e2e
        env:
          E2E_QUEUE: ${{ matrix.queue }}
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e
        run: make e2e
      - name: upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.queue }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
