name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k3d:
    name: k3d (${{ matrix.queue }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        queue: [bbolt, redis]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.1
      - name: install k3d
        run: |
          curl -fsSL https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64 -o /tmp/k3d
          # sha256 of k3d-linux-amd64 from the release's checksums.txt.
          echo "06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0  /tmp/k3d" | sha256sum -c -
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
      - name: e2e
        env:
          E2E_QUEUE: ${{ matrix.queue }}
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e
        run: make e2e
      - name: upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.queue }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
