name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k3d:
    name: k3d (${{ matrix.queue }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        queue: [bbolt, redis]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.1
      - name: install k3d
        run: |
          curl -fsSL https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64 -o /tmp/k3d
          # sha256 of k3d-linux-amd64 from the release's checksums.txt.
          echo "06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0  /tmp/k3d" | sha256sum -c -
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
      - name: e2e
        env:
          E2E_QUEUE: ${{ matrix.queue }}
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e
        run: make e2e
      - name: upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.queue }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore

  upgrade:
    name: upgrade (last release -> HEAD)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      E2E_QUEUE: bbolt
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # resolve the last release from the tags
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.1
      - name: install k3d
        run: |
          curl -fsSL https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64 -o /tmp/k3d
          # sha256 of k3d-linux-amd64 from the release's checksums.txt.
          echo "06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0  /tmp/k3d" | sha256sum -c -
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
      - name: previous release
        id: previous
        run: |
          tag="$(git -c versionsort.suffix=-rc tag --list 'v*' --sort=-v:refname | head -n1)"
          if [[ -z "$tag" ]]; then
            echo "no v* release tag; the upgrade job needs a published release" >&2
            exit 1
          fi
          echo "testing the upgrade from $tag"
          echo "from=${tag#v}" >> "$GITHUB_OUTPUT"
      # The chart and images of the last release are private GHCR packages.
      - name: log in to ghcr.io
        run: echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: release under test
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e
        run: make e2e-up
      - name: pull secret for the released images
        run: |
          kubectl --context k3d-mayfly-e2e create namespace mayfly-upgrade
          kubectl --context k3d-mayfly-e2e -n mayfly-upgrade create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ github.token }}"
      - name: upgrade test
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e
          E2E_GO_TEST_FLAGS: -run TestUpgradeFromLastRelease
          MAYFLY_E2E_UPGRADE_FROM: ${{ steps.previous.outputs.from }}
          MAYFLY_E2E_PULL_SECRET: ghcr-pull
        run: make e2e-test
      - name: upgrade diagnostics
        if: failure()
        run: |
          mkdir -p "${{ runner.temp }}/e2e"
          kubectl --context k3d-mayfly-e2e -n mayfly-upgrade get all,secrets,configmaps,pvc -o wide >"${{ runner.temp }}/e2e/upgrade-resources.txt" 2>&1 || true
          kubectl --context k3d-mayfly-e2e -n mayfly-upgrade logs deployment/mayfly-upgrade --all-containers --tail=-1 >"${{ runner.temp }}/e2e/upgrade-mayflyd.log" 2>&1 || true
      - name: upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-upgrade
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
      - name: delete cluster
        if: always()
        run: make e2e-down
