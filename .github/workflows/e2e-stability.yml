name: e2e-stability

# The 1.0 stability gate: 20 end-to-end runs, alternating the bbolt and redis
# queues, plus the repeated unit-test stress. See docs/testing.md.
#
# The run-name is how the release gate finds a dispatch that ran on another
# ref: it checks the run's head_sha or an exact `sha=<40-hex>` token in this
# title.
run-name: e2e-stability runs=${{ inputs.runs || '20' }} sha=${{ inputs.ref || github.sha }}

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Number of e2e runs; they alternate bbolt and redis
        required: false
        default: "20"
        type: string
      ref:
        description: Full 40-character commit SHA to test
        required: true
        type: string
  schedule:
    # Sunday 06:00 UTC: the default-branch tip.
    - cron: "0 6 * * 0"

permissions:
  contents: read

concurrency:
  group: e2e-stability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      runs: ${{ steps.plan.outputs.runs }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: resolve the commit to test
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          # A dispatch must name a commit. The schedule tests the
          # default-branch tip, which is github.sha when the cron fires.
          if [[ "$EVENT" == "schedule" ]]; then
            sha="$GITHUB_SHA"
          else
            sha="$INPUT_REF"
            if [[ -z "$sha" ]]; then
              echo "::error::ref is required: give a full 40-character commit SHA" >&2
              exit 1
            fi
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ref must be a full 40-character commit SHA, got '$sha'" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: build the run matrix
        id: plan
        env:
          RUNS: ${{ inputs.runs || '20' }}
        run: |
          if ! [[ "$RUNS" =~ ^[1-9][0-9]*$ ]] || (( RUNS > 100 )); then
            echo "runs must be an integer from 1 to 100, got '$RUNS'" >&2
            exit 1
          fi
          queues=(bbolt redis)
          entries=()
          for ((run = 1; run <= RUNS; run++)); do
            queue="${queues[$(( (run - 1) % 2 ))]}"
            entries+=("{\"run\":${run},\"queue\":\"${queue}\"}")
          done
          matrix=$(printf '%s\n' "${entries[@]}" | paste -sd, -)
          echo "runs=$RUNS" >> "$GITHUB_OUTPUT"
          echo "matrix={\"include\":[$matrix]}" >> "$GITHUB_OUTPUT"
          {
            echo "### e2e stability plan"
            echo
            echo "${RUNS} runs, alternating bbolt and redis. Unit stress runs 20 times."
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: e2e (${{ matrix.run }}/${{ matrix.queue }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1
      - name: install k3d
        run: |
          curl -fsSL https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64 -o /tmp/k3d
          # sha256 of k3d-linux-amd64 from the release's checksums.txt.
          echo "06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0  /tmp/k3d" | sha256sum -c -
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
      - name: e2e
        env:
          E2E_QUEUE: ${{ matrix.queue }}
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e
        run: make e2e
      - name: record the result
        if: always()
        env:
          RUN: ${{ matrix.run }}
          QUEUE: ${{ matrix.queue }}
          RESULT: ${{ job.status }}
        run: |
          mkdir -p "${{ runner.temp }}/result"
          printf '{"run":%s,"queue":"%s","result":"%s"}\n' "$RUN" "$QUEUE" "$RESULT" \
            >"${{ runner.temp }}/result/run-${RUN}-${QUEUE}.json"
      - name: upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-stability-${{ matrix.run }}-${{ matrix.queue }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
      - name: upload the run result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-stability-result-${{ matrix.run }}-${{ matrix.queue }}
          path: ${{ runner.temp }}/result
          if-no-files-found: ignore

  # The scan runs before the long matrix: a fixable CVE fails the gate in
  # minutes instead of after 20 e2e runs. It builds the gated commit's images
  # without pushing them, exactly as ci does. The job name avoids the
  # `e2e (<run>/<queue>)` pattern that internal/releasegate counts.
  preflight-scan:
    name: preflight-scan (${{ matrix.image }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [mayflyd, mayfly-agent]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: read the Trivy version
        id: trivy-version
        run: echo "value=$(cat .github/trivy-version)" >> "$GITHUB_OUTPUT"
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ steps.trivy-version.outputs.value }}
      - name: build without pushing
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/images/${{ matrix.image }}"
          mkdir -p "$dir"
          for platform in linux/amd64 linux/arm64; do
            docker buildx build \
              --file ./Dockerfile \
              --target "${{ matrix.image }}" \
              --platform "$platform" \
              --build-arg VERSION=0.0.0-stability \
              --build-arg COMMIT="${{ needs.plan.outputs.sha }}" \
              --build-arg DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --output "type=docker,dest=${dir}/${platform//\//-}.tar" \
              .
          done
      - name: scan both platforms
        run: hack/image-scan.sh --dir "$RUNNER_TEMP/images/${{ matrix.image }}"

  unit-stress:
    name: unit stress
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
      - name: stress
        run: ./hack/stress.sh 20

  gate:
    name: gate
    needs: [plan, preflight-scan, e2e, unit-stress]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-stability-result-*
          path: result
          merge-multiple: true
      - name: decide
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight-scan.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          STRESS_RESULT: ${{ needs.unit-stress.result }}
          RUNS: ${{ needs.plan.outputs.runs }}
        run: |
          {
            echo "### e2e stability gate"
            echo
            echo "| run | queue | result |"
            echo "| ---: | --- | --- |"
            for file in $(ls result/run-*.json 2>/dev/null | sort -V); do
              jq -r '. as $r | "| \($r.run) | \($r.queue) | " +
                (if $r.result == "success" then "pass" else "fail" end) + " |"' "$file"
            done
            echo
            echo "E2E runs: \`${E2E_RESULT}\`. Unit stress: \`${STRESS_RESULT}\`. Image scan: \`${PREFLIGHT_RESULT}\`."
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$PREFLIGHT_RESULT" != "success" || "$E2E_RESULT" != "success" || "$STRESS_RESULT" != "success" ]]; then
            echo "the stability gate is red: image-scan=${PREFLIGHT_RESULT} e2e=${E2E_RESULT} unit-stress=${STRESS_RESULT}" >&2
            exit 1
          fi

          if grep -l '"result":"failure"' result/run-*.json >/dev/null 2>&1; then
            echo "an e2e run recorded a failure" >&2
            exit 1
          fi
          # A run that did not upload its own result is a run the gate cannot
          # vouch for, even when the e2e job reports success.
          recorded=$(ls result/run-*.json 2>/dev/null | wc -l)
          if [[ "$recorded" -ne "${RUNS}" ]]; then
            echo "recorded ${recorded} of ${RUNS} e2e runs" >&2
            exit 1
          fi
          echo "all ${RUNS} e2e runs passed and the unit stress passed"
