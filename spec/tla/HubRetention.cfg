\* Positive configuration. TLC must find no invariant violation. The bounds
\* force eviction: two events of two bytes exceed the four-byte budget, and a
\* size of MaxEvent+1 tests the per-event cap. One inbox entry beyond MaxInbox
\* tests the count cap, and one key tests eviction and re-append.
SPECIFICATION Spec

CONSTANTS
    MaxEvents = 2
    MaxEvent = 2
    Budget = 4
    MaxAppends = 8
    Sizes = {1, 2, 3}
    MaxInbox = 2
    Keys = {"k1"}
    CapEvents = TRUE
    ExemptInbox = TRUE
    CapInbox = TRUE
    EvictKeys = TRUE

INVARIANTS
    TypeOK
    MonotonicSeq
    RetainedWithinBudget
    EventCapEnforced
    ContiguousSuffix
    InboxNeverEvictedByRuntime
    InboxWithinCap
    KeysMatchRetained
    NoDuplicateRetainedKey
