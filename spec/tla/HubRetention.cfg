\* Positive configuration. TLC must find no invariant violation. The bounds
\* force eviction: two events of two bytes exceed the three-byte budget, and a
\* size of MaxEvent+1 tests the per-event cap.
SPECIFICATION Spec

CONSTANTS
    MaxEvents = 2
    MaxEvent = 2
    Budget = 4
    MaxAppends = 8
    Sizes = {1, 2, 3}
    CapEvents = TRUE
    ExemptInbox = TRUE

INVARIANTS
    TypeOK
    MonotonicSeq
    RetainedWithinBudget
    EventCapEnforced
    ContiguousSuffix
    InboxNeverEvictedByRuntime
