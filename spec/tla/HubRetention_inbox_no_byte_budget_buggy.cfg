\* Negative check: let a human post grow the inbox without the byte budget.
\* Two messages of two bytes exceed a two-byte budget. The count cap still
\* holds, so only the byte bound is broken.
\* TLC must report InboxWithinBudget.
\* expect-violation: InboxWithinBudget
SPECIFICATION Spec

CONSTANTS
    MaxEvents = 2
    MaxEvent = 2
    Budget = 4
    MaxAppends = 4
    Sizes = {1, 2}
    MaxInbox = 3
    Keys = {"k1"}
    InboxBudget = 2
    HumanSizes = {2}
    CapEvents = TRUE
    ExemptInbox = TRUE
    CapInbox = TRUE
    CapInboxBytes = FALSE
    EvictKeys = TRUE

INVARIANTS
    TypeOK
    MonotonicSeq
    RetainedWithinBudget
    EventCapEnforced
    ContiguousSuffix
    InboxNeverEvictedByRuntime
    InboxWithinCap
    InboxWithinBudget
    KeysMatchRetained
    NoDuplicateRetainedKey
