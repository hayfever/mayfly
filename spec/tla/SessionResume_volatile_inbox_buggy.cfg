\* Negative check: no durable pending record. A message is in the in-memory
\* hub only, so a control-plane restart before the runtime starts the turn
\* loses it even though the sender was acknowledged. TLC must report
\* AcceptedNotLost.
\* expect-violation: AcceptedNotLost
SPECIFICATION Spec

CONSTANTS
    Sessions = {s1}
    MaxTurns = 2
    MaxRestarts = 1
    MaxPodKills = 0
    MaxReplacements = 0
    Block = 2
    ToolIdem = idem
    ToolNonIdem = nonidem
    LedgerBeforeDispatch = TRUE
    InterruptOnResume = TRUE
    DurableInbox = FALSE
    RedeliverNewKey = FALSE

INVARIANTS
    TypeOK
    AcceptedNotLost
