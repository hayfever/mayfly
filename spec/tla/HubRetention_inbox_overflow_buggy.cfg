\* Negative check: let a human post grow the inbox without the count cap.
\* TLC must report InboxWithinCap.
\* expect-violation: InboxWithinCap
SPECIFICATION Spec

CONSTANTS
    MaxEvents = 2
    MaxEvent = 2
    Budget = 4
    MaxAppends = 4
    Sizes = {1, 2}
    MaxInbox = 1
    Keys = {"k1"}
    InboxBudget = 100
    HumanSizes = {1}
    CapEvents = TRUE
    ExemptInbox = TRUE
    CapInbox = FALSE
    CapInboxBytes = TRUE
    EvictKeys = TRUE

INVARIANTS
    TypeOK
    MonotonicSeq
    RetainedWithinBudget
    EventCapEnforced
    ContiguousSuffix
    InboxNeverEvictedByRuntime
    InboxWithinCap
    InboxWithinBudget
    KeysMatchRetained
    NoDuplicateRetainedKey
