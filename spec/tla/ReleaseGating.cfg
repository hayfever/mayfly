\* Positive configuration. The gate is enforced, the release stays a draft
\* until every artifact exists, and an image tag waits for its signature. TLC
\* must find no invariant violation.
SPECIFICATION Spec

CONSTANTS
    RequireGate = TRUE
    DraftUntilComplete = TRUE
    SignBeforeTag = TRUE

INVARIANTS
    TypeOK
    NoPublishWithoutGate
    PublicReleaseComplete
    TagOnlySignedDigests
