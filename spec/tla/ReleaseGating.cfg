\* Positive configuration. The gate is enforced, the release stays a draft
\* until every artifact exists, an image tag waits for its signature, and a
\* release candidate never takes the `latest` marker. TLC must find no
\* invariant violation.
SPECIFICATION Spec

CONSTANTS
    RequireGate = TRUE
    DraftUntilComplete = TRUE
    SignBeforeTag = TRUE
    LatestPrerelease = FALSE

INVARIANTS
    TypeOK
    NoPublishWithoutGate
    PublicReleaseComplete
    TagOnlySignedDigests
    RCNeverLatest
