\* Negative check: keep a dedup key after its event is evicted. A key then
\* outlives every retained event, and a legitimate retry stays blocked.
\* TLC must report KeysMatchRetained.
\* expect-violation: KeysMatchRetained
SPECIFICATION Spec

CONSTANTS
    MaxEvents = 2
    MaxEvent = 2
    Budget = 2
    MaxAppends = 4
    Sizes = {1, 2}
    MaxInbox = 2
    Keys = {"k1"}
    CapEvents = TRUE
    ExemptInbox = TRUE
    CapInbox = TRUE
    EvictKeys = FALSE

INVARIANTS
    TypeOK
    MonotonicSeq
    RetainedWithinBudget
    EventCapEnforced
    ContiguousSuffix
    InboxNeverEvictedByRuntime
    InboxWithinCap
    KeysMatchRetained
    NoDuplicateRetainedKey
