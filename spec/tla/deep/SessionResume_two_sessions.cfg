\* Nightly configuration: two sessions sharing one control plane. It checks
\* that one control-plane restart, which hits both sessions at once, and the
\* shared runtime-instance counter keep every safety invariant for both. The
\* PR configurations cover pod kills, replacements, and the interrupt path with
\* one session; adding them here grows the state space past the nightly budget.
\*
\* Safety only: the liveness check over this state space needs far more time
\* and memory than a nightly run has. Measured with -workers auto: 51,066,742
\* states generated, 6,127,026 distinct, 10m31s; hack/tlc.sh --deep took
\* 14m44s end to end. Run with: hack/tlc.sh --deep (CI sets
\* TLC_JAVA_OPTS=-Xmx10g).
SPECIFICATION Spec

CONSTANTS
    Sessions = {s1, s2}
    MaxTurns = 1
    MaxRestarts = 1
    MaxPodKills = 0
    MaxReplacements = 0
    Block = 2
    ToolIdem = idem
    ToolNonIdem = nonidem
    LedgerBeforeDispatch = TRUE
    InterruptOnResume = TRUE
    DurableInbox = TRUE
    RedeliverNewKey = FALSE

INVARIANTS
    TypeOK
    UserMessageAtMostOnce
    AcceptedNotLost
    TurnKeyReserved
    NonIdempotentAtMostOnce
    CompletedReplays
    IdempotentSameKey
    NoResurrection
    JournalPrefix
    ConversationBounded
