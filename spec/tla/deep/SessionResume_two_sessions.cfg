\* Nightly configuration: two sessions sharing one control plane. It checks
\* that one control-plane restart, which hits both sessions at once, and the
\* shared runtime-instance counter keep every safety invariant for both. The
\* PR configuration covers pod kills, replacements, and the interrupt path with
\* one session; adding them here grows the state space past the nightly budget.
\*
\* Safety only: the liveness check over this state space needs far more time
\* and memory than a nightly run has. Measured on a 6-core desktop with
\* -Xmx4g: 36,379,140 states generated, 4,443,812 distinct, 20m16s.
\* Run with: hack/tlc.sh --deep (CI sets TLC_JAVA_OPTS=-Xmx10g).
SPECIFICATION Spec

CONSTANTS
    Sessions = {s1, s2}
    MaxTurns = 1
    MaxRestarts = 1
    MaxPodKills = 0
    MaxReplacements = 0
    Block = 2
    ToolIdem = idem
    ToolNonIdem = nonidem
    LedgerBeforeDispatch = TRUE
    InterruptOnResume = TRUE

INVARIANTS
    TypeOK
    UserMessageAtMostOnce
    TurnKeyReserved
    NonIdempotentAtMostOnce
    CompletedReplays
    IdempotentSameKey
    NoResurrection
    JournalPrefix
    ConversationBounded
