\* Nightly configuration: three callers share one session budget, the in-flight
\* cap stays at one, and the run may take two control-plane crashes. The longer
\* charge sequence reaches every spend value up to the budget, and the three
\* caller identities cover a caller that is admitted after another one settled.
\* Measured with -workers auto: 15,153 states generated, 4,894 distinct, about
\* one second. Safety only: the liveness check adds nothing at this bound.
SPECIFICATION Spec

CONSTANTS
    Budget = 16
    MaxCall = 4
    Callers = {c1, c2, c3}
    MaxCrashes = 2
    InflightCap = 1
    CheckBefore = TRUE
    PersistCharge = TRUE
    DurablePending = TRUE
    WaitForSettle = TRUE

INVARIANTS
    TypeOK
    BudgetBound
    NoChargeLost
    NoAdmitWhenExhausted
