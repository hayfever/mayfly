\* Positive configuration for the runtime-resume path. It reaches the tool
\* ledger and conversation replay with one pod kill and one replacement, which
\* the PR liveness configuration leaves out to keep its state space small.
\* Safety only; the liveness properties run in SessionResume.cfg.
SPECIFICATION Spec

CONSTANTS
    Sessions = {s1}
    MaxTurns = 1
    MaxRestarts = 0
    MaxPodKills = 1
    MaxReplacements = 1
    Block = 2
    ToolIdem = idem
    ToolNonIdem = nonidem
    LedgerBeforeDispatch = TRUE
    InterruptOnResume = TRUE
    DurableInbox = TRUE
    RedeliverNewKey = FALSE

INVARIANTS
    TypeOK
    UserMessageAtMostOnce
    AcceptedNotLost
    TurnKeyReserved
    NonIdempotentAtMostOnce
    CompletedReplays
    IdempotentSameKey
    NoResurrection
    JournalPrefix
    ConversationBounded
