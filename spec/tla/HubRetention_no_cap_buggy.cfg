\* Negative check: keep every runtime event at its offered size. The budget
\* still evicts, but a single retained event can exceed the per-event cap.
\* TLC must report EventCapEnforced.
\* expect-violation: EventCapEnforced
SPECIFICATION Spec

CONSTANTS
    MaxEvents = 2
    MaxEvent = 2
    Budget = 3
    MaxAppends = 4
    Sizes = {1, 2, 3}
    MaxInbox = 2
    Keys = {"k1"}
    CapEvents = FALSE
    ExemptInbox = TRUE
    CapInbox = TRUE
    EvictKeys = TRUE

INVARIANTS
    TypeOK
    MonotonicSeq
    RetainedWithinBudget
    EventCapEnforced
    ContiguousSuffix
    InboxNeverEvictedByRuntime
    InboxWithinCap
    KeysMatchRetained
    NoDuplicateRetainedKey
