\* Positive configuration. The budget gate runs before admission, one call is in
\* flight at a time, and each charge and reservation reaches the session
\* record. TLC must find no invariant violation and must prove that reaching
\* the budget closes the session.
SPECIFICATION Spec

CONSTANTS
    Budget = 3
    MaxCall = 2
    Callers = {c1, c2}
    MaxCrashes = 0
    InflightCap = 1
    CheckBefore = TRUE
    PersistCharge = TRUE
    DurablePending = TRUE

INVARIANTS
    TypeOK
    BudgetBound
    NoChargeLost
    NoAdmitWhenExhausted

PROPERTIES
    ClosedAfterExhaust
