\* Positive configuration. The budget gate runs before admission, one call is in
\* flight at a time, each charge and reservation reaches the session record, and
\* the client waits for the settle after it reads the reply. TLC must find no
\* invariant violation and must prove that reaching the budget closes the
\* session and that a busy refusal is followed by an admitted retry.
SPECIFICATION Spec

CONSTANTS
    Budget = 3
    MaxCall = 2
    Callers = {c1, c2}
    MaxCrashes = 0
    InflightCap = 1
    CheckBefore = TRUE
    PersistCharge = TRUE
    DurablePending = TRUE
    WaitForSettle = TRUE

INVARIANTS
    TypeOK
    BudgetBound
    NoChargeLost
    NoAdmitWhenExhausted
    ObserveKeepsSlot
    NoBusyAfterSettled

PROPERTIES
    ClosedAfterExhaust
    BusyRetryAdmitted
