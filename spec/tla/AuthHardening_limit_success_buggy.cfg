\* Negative check: the failure limiter is consulted before authentication, so
\* an over-budget client is refused even with a valid credential.
\* expect-violation: SuccessfulAuthNeverLimited
SPECIFICATION Spec

CONSTANTS
    IPs = {"a"}
    Burst = 2
    MaxOps = 3
    MaxKeys = 1
    AuditIndependentOfLevel = TRUE
    AuditFailedAuth = TRUE
    LimitFailedAuth = TRUE
    RejectShortTokens = TRUE
    LimitSuccessBeforeAuth = TRUE

INVARIANTS
    TypeOK
    SuccessfulAuthNeverLimited
