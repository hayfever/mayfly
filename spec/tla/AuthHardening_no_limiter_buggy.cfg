\* Negative check: failed authentication has no per-IP limiter, so one address
\* spends more than one burst of attempts.
\* expect-violation: FailedAuthBounded
SPECIFICATION Spec

CONSTANTS
    IPs = {"a"}
    Burst = 2
    MaxOps = 4
    MaxKeys = 1
    AuditIndependentOfLevel = TRUE
    AuditFailedAuth = TRUE
    LimitFailedAuth = FALSE
    RejectShortTokens = TRUE
    LimitSuccessBeforeAuth = FALSE

INVARIANTS
    TypeOK
    FailedAuthBounded
