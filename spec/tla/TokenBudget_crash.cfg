\* Positive configuration with crashes. Two crashes and recoveries must not lose
\* a provider charge, and the counter must stay within one response of the
\* budget. TLC must find no invariant violation and must prove the liveness
\* property.
SPECIFICATION Spec

CONSTANTS
    Budget = 3
    MaxCall = 2
    Callers = {c1, c2}
    MaxCrashes = 2
    InflightCap = 1
    CheckBefore = TRUE
    PersistCharge = TRUE
    DurablePending = TRUE
    WaitForSettle = TRUE

INVARIANTS
    TypeOK
    BudgetBound
    NoChargeLost
    NoAdmitWhenExhausted
    ObserveKeepsSlot
    NoBusyAfterSettled

PROPERTIES
    ClosedAfterExhaust
