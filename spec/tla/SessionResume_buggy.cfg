\* Negative check: record the ledger entry after dispatch, not before.
\* A non-idempotent call that runs and then loses its container before the
\* result is recorded leaves no pending record, so the replacement resumes and
\* runs the tool a second time. TLC must report NonIdempotentAtMostOnce.
\* expect-violation: NonIdempotentAtMostOnce
SPECIFICATION Spec

CONSTANTS
    Sessions = {s1}
    MaxTurns = 1
    MaxRestarts = 0
    MaxPodKills = 1
    MaxReplacements = 1
    Block = 2
    ToolIdem = idem
    ToolNonIdem = nonidem
    LedgerBeforeDispatch = FALSE
    InterruptOnResume = TRUE


INVARIANTS
    TypeOK
    NonIdempotentAtMostOnce
