\* Negative check: let thread eviction also consume the matching inbox entry.
\* A runtime event flood then drops a human message the runtime has not read.
\* TLC must report InboxNeverEvictedByRuntime.
\* expect-violation: InboxNeverEvictedByRuntime
SPECIFICATION Spec

CONSTANTS
    MaxEvents = 2
    MaxEvent = 2
    Budget = 3
    MaxAppends = 4
    Sizes = {1, 2, 3}
    CapEvents = TRUE
    ExemptInbox = FALSE

INVARIANTS
    TypeOK
    MonotonicSeq
    RetainedWithinBudget
    EventCapEnforced
    ContiguousSuffix
    InboxNeverEvictedByRuntime
