\* Negative check: let thread eviction also consume the matching inbox entry.
\* A runtime event flood then drops a human message the runtime has not read.
\* TLC must report InboxNeverEvictedByRuntime.
\* expect-violation: InboxNeverEvictedByRuntime
SPECIFICATION Spec

CONSTANTS
    MaxEvents = 2
    MaxEvent = 2
    Budget = 3
    MaxAppends = 4
    Sizes = {1, 2, 3}
    MaxInbox = 2
    Keys = {"k1"}
    InboxBudget = 100
    HumanSizes = {1}
    CapEvents = TRUE
    ExemptInbox = FALSE
    CapInbox = TRUE
    CapInboxBytes = TRUE
    EvictKeys = TRUE

INVARIANTS
    TypeOK
    MonotonicSeq
    RetainedWithinBudget
    EventCapEnforced
    ContiguousSuffix
    InboxNeverEvictedByRuntime
    InboxWithinCap
    InboxWithinBudget
    KeysMatchRetained
    NoDuplicateRetainedKey
