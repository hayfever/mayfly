\* Negative check: the caller treats "data: [DONE]" as a settled call, which is
\* the pre-fix assumption of the e2e busy-overlap test. The reply is complete
\* on the wire while the broker still reads upstream to EOF, so the next call
\* arrives while the session's only slot is held and is refused busy. TLC must
\* report NoBusyAfterSettled.
\* expect-violation: NoBusyAfterSettled
SPECIFICATION Spec

CONSTANTS
    Budget = 3
    MaxCall = 2
    Callers = {c1, c2}
    MaxCrashes = 0
    InflightCap = 1
    CheckBefore = TRUE
    PersistCharge = TRUE
    DurablePending = TRUE
    WaitForSettle = FALSE

INVARIANTS
    TypeOK
    ObserveKeepsSlot
    NoBusyAfterSettled
