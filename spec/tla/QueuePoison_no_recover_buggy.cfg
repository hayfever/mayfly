\* Negative check: do not recover a handler panic. The poison job crashes the
\* worker instead of being Nacked, so a panic ends the process and every other
\* job stops with it.
\* expect-violation: NoPanicCrash
SPECIFICATION Spec

CONSTANTS
    Jobs = {"poison", "healthy"}
    Poison = {"poison"}
    MaxAttempts = 2
    RecoverPanics = FALSE
    CountAttemptOnClaim = TRUE

INVARIANTS
    TypeOK
    AttemptsWithinMax
    NoLostJob
    NoPanicCrash
    CrashesBounded
