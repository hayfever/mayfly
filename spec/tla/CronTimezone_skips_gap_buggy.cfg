\* Negative check: skip the civil time that the spring-forward gap removes.
\* The selected 02:30 then produces no slot for the transition day. TLC must
\* report GapFiresAtTransition.
\* expect-violation: GapFiresAtTransition
SPECIFICATION Spec

CONSTANTS
    Mode = "spring"
    ScheduledCivil = 150
    GapStart = 120
    GapEnd = 180
    AmbStart = 60
    AmbEnd = 120
    OffsetBefore = 300
    OffsetAfter = 240
    Days = 2
    FireGapAtTransition = FALSE
    DoubleFallback = FALSE

INVARIANTS
    TypeOK
    ValidSlotKeys
    GapFiresAtTransition
    FallbackFiresOnce
