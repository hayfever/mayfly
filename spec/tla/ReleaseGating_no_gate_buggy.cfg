\* Negative check: publish without a successful gate. With RequireGate = FALSE
\* the publish job runs while the gate is still pending.
\* TLC must report NoPublishWithoutGate.
\* expect-violation: NoPublishWithoutGate
SPECIFICATION Spec

CONSTANTS
    RequireGate = FALSE
    DraftUntilComplete = TRUE
    SignBeforeTag = TRUE
    LatestPrerelease = FALSE

INVARIANTS
    TypeOK
    NoPublishWithoutGate
