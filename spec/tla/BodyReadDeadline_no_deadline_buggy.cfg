\* Negative check: remove the read deadline. A client that sends headers and
\* then stalls the body keeps the handler waiting past BodyReadTimeout.
\* TLC must report NoUnboundedBodyRead.
\* expect-violation: NoUnboundedBodyRead
SPECIFICATION Spec

CONSTANTS
    BodyReadTimeout = 2
    MaxTicks = 5
    ApplyDeadline = FALSE

INVARIANTS
    TypeOK
    NoUnboundedBodyRead
