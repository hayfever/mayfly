\* Negative check: do not count an attempt on claim, and do not recover the
\* handler panic. A crashed worker's lease is reclaimed with the same attempt
\* count forever, so one poison job crashes the process without bound. This is
\* the pre-fix behavior the claim-time counter removes.
\* expect-violation: CrashesBounded
SPECIFICATION Spec

CONSTANTS
    Jobs = {"poison", "healthy"}
    Poison = {"poison"}
    MaxAttempts = 2
    RecoverPanics = FALSE
    CountAttemptOnClaim = FALSE

INVARIANTS
    TypeOK
    AttemptsWithinMax
    NoLostJob
    CrashesBounded
