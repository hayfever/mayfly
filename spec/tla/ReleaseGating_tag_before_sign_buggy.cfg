\* Negative check: tag the image before signing it. The image job creates the
\* version tags while the digest has no signature.
\* TLC must report TagOnlySignedDigests.
\* expect-violation: TagOnlySignedDigests
SPECIFICATION Spec

CONSTANTS
    RequireGate = TRUE
    DraftUntilComplete = TRUE
    SignBeforeTag = FALSE

INVARIANTS
    TypeOK
    TagOnlySignedDigests
