\* Negative check: no in-flight cap. Two callers are admitted at
\* spent = Budget - 1, and both responses charge MaxCall, so the provider's
\* charge exceeds the one-response allowance. TLC must report BudgetBound.
\* expect-violation: BudgetBound
SPECIFICATION Spec

CONSTANTS
    Budget = 3
    MaxCall = 2
    Callers = {c1, c2}
    MaxCrashes = 0
    InflightCap = 2
    CheckBefore = TRUE
    PersistCharge = TRUE
    DurablePending = TRUE
    WaitForSettle = TRUE

INVARIANTS
    TypeOK
    BudgetBound
    NoChargeLost
    NoAdmitWhenExhausted
