\* Negative check: the budget is tested only after the charge. Admit has no
\* spend precondition, so a call is admitted with the counter already at or
\* over Budget and the provider's total passes the one-response allowance.
\* TLC must report BudgetBound. NoAdmitWhenExhausted is omitted: this cfg
\* admits past the limit by construction, so BudgetBound is the invariant that
\* must bite.
\* expect-violation: BudgetBound
SPECIFICATION Spec

CONSTANTS
    Budget = 3
    MaxCall = 2
    Callers = {c1, c2}
    MaxCrashes = 0
    InflightCap = 1
    CheckBefore = FALSE
    PersistCharge = TRUE
    DurablePending = TRUE

INVARIANTS
    TypeOK
    BudgetBound
    NoChargeLost
