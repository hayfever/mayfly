\* Positive configuration. TLC must find no invariant violation and must prove
\* both liveness properties. Keep the bounds small: this runs in CI on each
\* pull request.
SPECIFICATION Spec

CONSTANTS
    Sessions = {s1}
    MaxTurns = 2
    MaxRestarts = 1
    MaxPodKills = 0
    MaxReplacements = 0
    Block = 2
    ToolIdem = idem
    ToolNonIdem = nonidem
    LedgerBeforeDispatch = TRUE
    InterruptOnResume = TRUE
    DurableInbox = TRUE
    RedeliverNewKey = FALSE


INVARIANTS
    TypeOK
    UserMessageAtMostOnce
    AcceptedNotLost
    TurnKeyReserved
    NonIdempotentAtMostOnce
    CompletedReplays
    IdempotentSameKey
    NoResurrection
    JournalPrefix
    ConversationBounded

PROPERTIES
    Termination
    Reclamation
