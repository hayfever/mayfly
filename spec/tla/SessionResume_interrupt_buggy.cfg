\* Negative check: dispatch a pending non-idempotent call again instead of
\* recording it as interrupted. A replacement runtime that finds the pending
\* record from the dead instance runs the tool a second time. TLC must report
\* NonIdempotentAtMostOnce.
\* expect-violation: NonIdempotentAtMostOnce
SPECIFICATION Spec

CONSTANTS
    Sessions = {s1}
    MaxTurns = 1
    MaxRestarts = 0
    MaxPodKills = 1
    MaxReplacements = 1
    Block = 2
    ToolIdem = idem
    ToolNonIdem = nonidem
    LedgerBeforeDispatch = TRUE
    InterruptOnResume = FALSE
    DurableInbox = TRUE
    RedeliverNewKey = FALSE

INVARIANTS
    TypeOK
    NonIdempotentAtMostOnce
