\* Negative check: the charge is never written to the session record, the
\* journalBytes-style lifetime counter. A restart seeds the counter from the
\* record and loses every settled charge. TLC must report NoChargeLost.
\* expect-violation: NoChargeLost
SPECIFICATION Spec

CONSTANTS
    Budget = 3
    MaxCall = 2
    Callers = {c1, c2}
    MaxCrashes = 1
    InflightCap = 1
    CheckBefore = TRUE
    PersistCharge = FALSE
    DurablePending = TRUE
    WaitForSettle = TRUE

INVARIANTS
    TypeOK
    NoChargeLost
