\* Positive configuration: a fall-back overlap repeats 01:30 at both offsets.
\* The schedule fires once, at the first occurrence. TLC must find no
\* invariant violation.
SPECIFICATION Spec

CONSTANTS
    Mode = "fall"
    ScheduledCivil = 90
    GapStart = 120
    GapEnd = 180
    AmbStart = 60
    AmbEnd = 120
    OffsetBefore = 300
    OffsetAfter = 240
    Days = 2
    FireGapAtTransition = TRUE
    DoubleFallback = FALSE

INVARIANTS
    TypeOK
    ValidSlotKeys
    GapFiresAtTransition
    FallbackFiresOnce
