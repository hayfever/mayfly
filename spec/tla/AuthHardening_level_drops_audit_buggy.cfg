\* Negative check: write audit lines through the level-filtered process logger.
\* At warn or error the mutating audit line disappears.
\* expect-violation: AuditAlwaysEmitted
SPECIFICATION Spec

CONSTANTS
    IPs = {"a"}
    Burst = 2
    MaxOps = 3
    MaxKeys = 1
    AuditIndependentOfLevel = FALSE
    AuditFailedAuth = TRUE
    LimitFailedAuth = TRUE
    RejectShortTokens = TRUE
    LimitSuccessBeforeAuth = FALSE

INVARIANTS
    TypeOK
    AuditAlwaysEmitted
