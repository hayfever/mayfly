\* Positive configuration: a spring-forward day removes the scheduled civil
\* time (02:30 in a zone that shifts -05:00 to -04:00). The schedule fires once
\* at the transition instant. TLC must find no invariant violation.
SPECIFICATION Spec

CONSTANTS
    Mode = "spring"
    ScheduledCivil = 150
    GapStart = 120
    GapEnd = 180
    AmbStart = 60
    AmbEnd = 120
    OffsetBefore = 300
    OffsetAfter = 240
    Days = 2
    FireGapAtTransition = TRUE
    DoubleFallback = FALSE

INVARIANTS
    TypeOK
    ValidSlotKeys
    GapFiresAtTransition
    FallbackFiresOnce
