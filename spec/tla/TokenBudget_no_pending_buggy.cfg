\* Negative check: the per-call reservation never reaches the session record. A
\* charge has no durable coverage while the call is in flight, and a crash
\* before the settlement loses it. TLC must report NoChargeLost.
\* expect-violation: NoChargeLost
SPECIFICATION Spec

CONSTANTS
    Budget = 3
    MaxCall = 2
    Callers = {c1, c2}
    MaxCrashes = 1
    InflightCap = 1
    CheckBefore = TRUE
    PersistCharge = TRUE
    DurablePending = FALSE

INVARIANTS
    TypeOK
    NoChargeLost
