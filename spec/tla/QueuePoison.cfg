\* Positive configuration. TLC must find no invariant violation and must prove
\* HealthyJobsProgress. One poison job and one healthy job cover the claim,
\* panic, Nack, burial, and healthy-progress paths.
SPECIFICATION Spec

CONSTANTS
    Jobs = {"poison", "healthy"}
    Poison = {"poison"}
    MaxAttempts = 2
    RecoverPanics = TRUE
    CountAttemptOnClaim = TRUE

INVARIANTS
    TypeOK
    AttemptsWithinMax
    NoLostJob
    NoPanicCrash
    CrashesBounded

PROPERTIES
    HealthyJobsProgress
