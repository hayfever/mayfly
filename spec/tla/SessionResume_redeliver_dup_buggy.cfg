\* Negative check: adoption redelivers a pending message under a new turn key
\* instead of the reserved one. The same accepted message is then started as
\* two turns, which the runtime's step-0 identity check exists to prevent.
\* TLC must report UserMessageAtMostOnce.
\* expect-violation: UserMessageAtMostOnce
SPECIFICATION Spec

CONSTANTS
    Sessions = {s1}
    MaxTurns = 2
    MaxRestarts = 1
    MaxPodKills = 0
    MaxReplacements = 0
    Block = 2
    ToolIdem = idem
    ToolNonIdem = nonidem
    LedgerBeforeDispatch = TRUE
    InterruptOnResume = TRUE
    DurableInbox = TRUE
    RedeliverNewKey = TRUE

INVARIANTS
    TypeOK
    UserMessageAtMostOnce
